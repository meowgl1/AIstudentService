<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Support Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/custom.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark navbar-uni"><div class="container">
    <span class="navbar-brand">Student Support Portal</span>
    <div class="d-flex gap-3">
      <a class="nav-link text-white" href="index.html">Home</a>
      <a class="nav-link text-white" href="staff.html">Staff</a>
    </div>
  </div></nav>

  <main class="container my-4">
    <div class="row g-4">
      <div class="col-lg-7">
        <div class="card p-4">
          <h1 class="h4">Ask for help</h1>
          <p class="text-muted">Send one ticket. An AI assistant helps sort your ticket and prepare a draft reply from the official Torrens FAQ. A staff member checks every reply before you see it.</p>
          <form id="ticketForm">
            <div class="mb-3"><label class="form-label" for="studentName">Name</label>
              <input class="form-control" id="studentName" required maxlength="120"></div>
            <div class="mb-3"><label class="form-label" for="studentEmail">Student email</label>
              <input class="form-control" id="studentEmail" type="email" required></div>
            <div class="mb-3"><label class="form-label" for="subject">Subject</label>
              <input class="form-control" id="subject" required maxlength="200"></div>
            <div class="mb-3"><label class="form-label" for="body">Your question</label>
              <textarea class="form-control" id="body" rows="5" required maxlength="4000"></textarea>
              <div class="form-text">Do not include passwords or payment details.</div></div>
            <button class="btn btn-primary" type="submit">Submit ticket</button>
          </form>
          <div id="submitResult" class="alert mt-3 d-none" role="status"></div>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="card p-4">
          <h2 class="h5">Check your ticket</h2>
          <form id="statusForm" class="d-flex gap-2">
            <input class="form-control" id="ticketId" placeholder="Paste your ticket ID" required>
            <button class="btn btn-accent" type="submit">Check</button>
          </form>
          <div id="statusResult" class="mt-3"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/sample-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/student.js"></script>
</body>
</html>
