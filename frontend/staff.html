<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff Review</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/custom.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark navbar-uni"><div class="container">
    <span class="navbar-brand">Staff Review</span>
    <div class="d-flex align-items-center gap-2">
      <input id="staffName" class="form-control form-control-sm" placeholder="Your name" style="width:160px">
      <a class="nav-link text-white" href="student.html">Student page</a>
      <a class="nav-link text-white" href="index.html">Home</a>
    </div>
  </div></nav>

  <main class="container my-4">
    <div class="row g-4">
      <div class="col-lg-5">
        <div class="card p-3">
          <div class="d-flex gap-2 align-items-center mb-2">
            <h1 class="h5 m-0 me-auto">Tickets</h1>
            <select id="filterStatus" class="form-select form-select-sm w-auto" aria-label="Filter by status">
              <option value="">All statuses</option>
              <option value="PENDING_REVIEW">Pending review</option>
              <option value="ESCALATED">Escalated</option>
              <option value="NEEDS_ASSIGNMENT">Needs team</option>
              <option value="PUBLISHED">Published</option>
            </select>
            <select id="filterTeam" class="form-select form-select-sm w-auto" aria-label="Filter by team"></select>
          </div>
          <div class="table-responsive">
            <table class="table table-sm mb-0">
              <thead><tr><th>Subject</th><th>Team</th><th>Status</th></tr></thead>
              <tbody id="ticketList"></tbody>
            </table>
          </div>
          <div id="listError" class="small text-danger mt-2"></div>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="card p-4" id="detail"><p class="text-muted m-0">Select a ticket to review.</p></div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/sample-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/staff.js"></script>
</body>
</html>
